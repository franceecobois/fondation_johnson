    <!-- Redirection automatique selon la langue du navigateur -->
    <script>
        (function () {
            var langs = navigator.languages
                ? navigator.languages
                : [navigator.language || navigator.userLanguage || 'en'];

            var target = 'index-en.html'; // langue de repli : anglais

            for (var i = 0; i < langs.length; i++) {
                var l = (langs[i] || '').toLowerCase();
                if (l.indexOf('es') === 0) { target = 'index-es.html'; break; }
                if (l.indexOf('pt') === 0) { target = 'index-pt.html'; break; }
                if (l.indexOf('en') === 0) { target = 'index-en.html'; break; }
            }

            window.location.replace(target);
        })();
    </script>
